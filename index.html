<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Piece</title>
<style>
	html, body { margin: 0; height: 100%; background: #0b1530; color: #cfd8ea; }
	body { display: flex; align-items: center; justify-content: center; font: 18px -apple-system, sans-serif; }
</style>
</head>
<body>
<p>불러오는 중...</p>
<script>
// 공개 주소 맨 앞 페이지 — 최신 빌드 폴더(v날짜시각/)로 넘겨 줍니다 (조각 3).
// `폰에 올리기.command` 가 v20261011-040309 자리에 이번 폴더 이름을 넣습니다.
//
// GitHub Pages 는 이 페이지도 10분쯤 기억해서, 방금 열어 본 폰은 옛 폴더로 넘어갈 수 있어요.
// 그래서 latest.txt 를 **매번 새로**(?t=지금) 받아서 거기 적힌 폴더로 갑니다.
// 못 받으면 이 페이지를 만들 때의 폴더로 갑니다.
(function () {
	var made = "v20261011-040309";
	function go(v) {
		location.replace(v + "/");
	}
	fetch("latest.txt?t=" + Date.now(), { cache: "no-store" })
		.then(function (r) { return r.ok ? r.text() : made; })
		.then(function (t) {
			t = String(t).trim();
			go(/^v[0-9-]+$/.test(t) ? t : made);
		})
		.catch(function () { go(made); });
})();
</script>
</body>
</html>
